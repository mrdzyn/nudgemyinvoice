<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="NudgeMyInvoice hero illustration: invoice draft card, Nudgey assistant badge, and PayPal Sandbox only pill">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1A3A"/>
      <stop offset="1" stop-color="#10265C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="150" fill="#2563EB" opacity="0.18"/>
  <circle cx="120" cy="380" r="110" fill="#22D3EE" opacity="0.12"/>
  <rect x="64" y="48" width="76" height="76" rx="18" fill="url(#accent)"/>
  <text x="102" y="102" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#FFFFFF" text-anchor="middle">N</text>
  <text x="160" y="92" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#FFFFFF">NudgeMyInvoice</text>
  <text x="160" y="128" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#7DD3FC">The AI invoice assistant that helps freelancers get paid.</text>
  <rect x="160" y="152" width="250" height="34" rx="17" fill="none" stroke="#FACC15" stroke-width="2"/>
  <text x="285" y="175" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FACC15" text-anchor="middle">PAYPAL SANDBOX ONLY</text>
  <text x="160" y="228" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#E2E8F0">Describe the work. Review the AI draft.</text>
  <text x="160" y="258" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#E2E8F0">Save it yourself. Humans approve every PayPal step.</text>
  <rect x="160" y="288" width="330" height="52" rx="26" fill="#2563EB"/>
  <text x="325" y="321" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Describe &#8594; Draft &#8594; Review &#8594; Save</text>
  <g>
    <rect x="760" y="60" width="376" height="220" rx="16" fill="#FFFFFF"/>
    <rect x="760" y="60" width="376" height="56" rx="16" fill="#EFF6FF"/>
    <rect x="760" y="100" width="376" height="16" fill="#EFF6FF"/>
    <text x="784" y="94" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0F172A">Invoice draft &#183; USD</text>
    <text x="784" y="150" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">2 &#215; logo concepts &#8230;&#8230;&#8230; $500.00</text>
    <text x="784" y="178" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">Tax (8%) &#8230;&#8230;&#8230;&#8230;&#8230;&#8230;&#8230;&#8230; +$40.00</text>
    <text x="784" y="212" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0F172A">Total &#8230;&#8230;&#8230;&#8230;&#8230;&#8230;&#8230;&#8230;&#8230;&#8230; $540.00</text>
    <rect x="784" y="228" width="200" height="32" rx="16" fill="#DCFCE7"/>
    <text x="884" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">DRAFT &#183; not sent</text>
  </g>
  <g>
    <rect x="800" y="304" width="296" height="64" rx="32" fill="#2563EB"/>
    <text x="830" y="344" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF">&#10022;</text>
    <text x="866" y="344" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">Nudgey &#183; your invoice companion</text>
  </g>
</svg>
