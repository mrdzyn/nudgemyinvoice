name: Nudgey formatter diff (temporary)
on:
  push:
    branches:
      - feat/nmi-ux02-nudgey
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print formatter diff
        run: |
          pnpm exec prettier --write apps/web/src/components/Nudgey.tsx
          git --no-pager diff -- apps/web/src/components/Nudgey.tsx
